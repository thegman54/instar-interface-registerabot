name: registerabot
display_name: RegisterABot
description: BYOA relay — WebSocket connection to RegisterABot service
version: "1.0"
type: interface
tenancy: multi_tenant
connection:
  pattern: websocket
  port: 8091
  container_name: registerabot-api
credentials:
  - REGISTERABOT_RELAY_URL
  - REGISTERABOT_BOT_SLUG
  - REGISTERABOT_API_KEY
  # Host mode: one socket carries all our bots. When both are present the adapter connects to
  # /ws/host/:account and attach/detaches slugs instead of one WS per bot.
  - REGISTERABOT_ACCOUNT_ID
  - REGISTERABOT_ACCOUNT_KEY
binding_fields:
  - name: bot_slug
    label: Bot Slug
    type: text
    required: true
  - name: api_key
    label: API Key
    type: password
    required: true
