# =============================================================================
# REGISTERABOT INTERFACE TOOL STACK
#
# Connects to RegisterABot relay via WebSocket as a bot.
# Receives messages from services/visitors, routes through gatekeeper and bot.
# Secrets (REGISTERABOT_*) fetched from Infisical at startup.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # REGISTERABOT API - WebSocket listener + message router
  # ---------------------------------------------------------------------------
  api:
    build: .
    container_name: registerabot-api
    environment:
      - INFISICAL_URL=http://infisical:8080
      - INFISICAL_TOKEN=${INFISICAL_TOKEN}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_ENVIRONMENT=${INFISICAL_ENVIRONMENT:-prod}
      - REGISTERABOT_RELAY_URL=${REGISTERABOT_RELAY_URL:-wss://relay.registerabot.com}
      - GATEKEEPER_URL=${GATEKEEPER_URL:-http://gatekeeper:8080}
      - BOT_SERVICE_URL=${BOT_SERVICE_URL:-http://bot:8080}
      # Speak each tool step aloud as it happens — one TTS call per step, so default OFF.
      - REGISTERABOT_NARRATE_TOOLS=${REGISTERABOT_NARRATE_TOOLS:-0}
      # Stream the talking head as several clips instead of one. OFF — tried 2026-08-17 and
      # backed out: the joins are audible. Each chunk is an independently encoded AAC track,
      # and AAC carries encoder delay + padding at every boundary, so playing clips back to
      # back inserts real gaps and clicks. That is a property of concatenating separate MP4s,
      # not of where the cut lands — no smarter cut point fixes it. Seamless streaming needs
      # ONE continuous audio track: fMP4 segments through MediaSource Extensions, the
      # 'mp4-segment' format already sketched in docs/STREAMING_CHAT_BROKER.md. Until then a
      # single clip is the only thing that sounds right, so make the whole render faster
      # rather than cutting it up. Override via the TOOL-EXECUTOR service's env.
      - FACE_CHUNKED=${FACE_CHUNKED:-0}
      # WHICH TALKING-HEAD ENGINE RENDERS THE REPLY.
      #
      # Defaults to float-renderer, not the MuseTalk one it used to reach implicitly.
      # MuseTalk moves the mouth and nothing else: in photo mode the head is frozen and
      # never blinks, which is why an idle loop had to be built and crossfaded separately.
      # FLOAT generates blinks and head motion from the audio. Measured on one portrait
      # and 7.6s of speech: 25fps against 12 and 50% more mouth motion; on 8s of silence,
      # four blinks against none.
      #
      # Both speak the same HTTP contract, so this is a URL change and nothing else.
      # Point it back at http://instar-face-renderer:8088 to return to MuseTalk.
      - FACE_RENDERER_URL=${FACE_RENDERER_URL:-http://instar-float-renderer:8098}
      # Where the face-config cache lives. On a volume, not /tmp: the cache exists to
      # cover the gap after a restart, and a restart is exactly when /tmp is emptied.
      - FACE_CFG_CACHE=/state/face_cfg_by_slug.json
      - PORT=8091
    volumes:
      - registerabot_state:/state
    ports:
      - "8091:8091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - instar-internal
      - instar-network
      - instar-bot

networks:
  instar-internal:
    external: true
  instar-network:
    external: true
  instar-bot:
    external: true

volumes:
  registerabot_state:
